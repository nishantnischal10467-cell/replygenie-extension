name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          # Core HTML pages
          cp index.html _site/index.html
          cp Landingpage.html _site/Landingpage.html
          # CSS + JS (landing page stylesheet and motion script)
          mkdir -p _site/src/landing
          cp src/landing/landing.css _site/src/landing/landing.css
          cp src/landing/demo.js     _site/src/landing/demo.js
          cp src/landing/motion.js   _site/src/landing/motion.js
          # Favicon and brand icons (stored in public/ in this repo)
          cp -r public/. _site/
          # Copy any root-level favicon files that exist
          for f in favicon.ico favicon.svg favicon-96x96.png apple-touch-icon.png site.webmanifest; do
            [ -f "$f" ] && cp "$f" "_site/$f" || true
          done
          echo "Pages content ready:"
          ls -la _site/


      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
