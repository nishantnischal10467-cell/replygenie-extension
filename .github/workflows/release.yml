name: Release — Package Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run syntax checks and tests before packaging
        run: |
          # Core extension files
          node --check src/background/background.js
          node --check src/background/templates.js
          node --check src/background/storage.js
          # Phase 1 safety rails
          node --check src/background/flags.js
          node --check src/background/governor.js
          node --check src/background/logger.js
          node --check src/background/prompt.js
          # Phase 2 database & retention layer
          node --check src/background/db/schema.js
          node --check src/background/db/migrations.js
          node --check src/background/db/database.js
          node --check src/background/db/retention.js
          # Phase 3 analyzer, embeddings, retrieval & pacing
          node --check src/background/embeddings.js
          node --check src/background/analyzer.js
          node --check src/background/retriever.js
          node --check src/background/pacer.js
          node --check src/content/pacer.js
          # Phase 4 performance-aware ranker
          node --check src/background/ranker.js
          # Phase 5 confidence routing, adapter, two-stage generator
          node --check src/background/router.js
          node --check src/background/adapter.js
          node --check src/background/generator.js
          # Phase 6 quality evaluator & accuracy gate
          node --check src/background/evaluator.js
          # Phase 8 voice profiler
          node --check src/background/profiler.js
          # Phase 9 learning loop & pattern miner
          node --check src/background/learning.js
          # Phase 10 analytics dashboard data layer
          node --check src/background/analytics.js
          node --check src/content/content.js
          node --check src/popup/popup.js
          node --check src/options/options.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
          # Run test suite
          npm install
          npm test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package extension (zip)
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          FILENAME="replygenie-extension-v${VERSION}.zip"

          # Include only the files Chrome actually needs to load the extension
          zip -r "$FILENAME" \
            manifest.json \
            src/background/background.js \
            src/background/templates.js \
            src/background/storage.js \
            src/background/flags.js \
            src/background/governor.js \
            src/background/logger.js \
            src/background/prompt.js \
            src/background/db/ \
            src/background/embeddings.js \
            src/background/analyzer.js \
            src/background/retriever.js \
            src/background/pacer.js \
            src/background/ranker.js \
            src/background/router.js \
            src/background/adapter.js \
            src/background/generator.js \
            src/background/evaluator.js \
            src/background/profiler.js \
            src/background/learning.js \
            src/background/analytics.js \
            src/content/content.js \
            src/content/content.css \
            src/content/pacer.js \
            src/popup/popup.html \
            src/popup/popup.js \
            src/popup/popup.css \
            src/options/options.html \
            src/options/options.js \
            src/options/options.css \
            icons/ \
            public/icons/



          echo "Created: $FILENAME"
          ls -lh "$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat > release_notes.md << EOF
          ## ReplyGenie v${VERSION}

          ### Install (Developer Mode)
          1. Download \`${{ env.FILENAME }}\` and unzip it.
          2. Open \`chrome://extensions\` → Enable **Developer mode**.
          3. Click **Load unpacked** and select the unzipped folder.

          ### Changes
          <!-- Add changelog here or link to CHANGELOG.md -->

          See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup instructions.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ReplyGenie v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: ${{ env.FILENAME }}
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
